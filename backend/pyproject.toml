[project]
name = "backend"
version = "0.1.0"
description = "Local voice and whiteboard interview practice for DevOps and SRE roles"
readme = "README.md"
authors = [
    { name = "JOSHUAJEBARAJ", email = "joshuajebaraj.z@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
